<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mithril clock (fixed)</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="../node_modules/mithril/mithril.js"></script>
    <script>
      function Clock() {
        let seconds = 0
        // A timer isn't a Mithril event handler, so ask for the redraw.
        const timer = setInterval(() => {
          seconds += 1
          m.redraw()
        }, 1000)
        return {
          onremove: () => clearInterval(timer),
          view: () => [
            m('p', `${seconds} seconds`),
            m('button', { type: 'button', onclick: () => {} }, 'Refresh'),
          ],
        }
      }

      m.mount(document.getElementById('app'), Clock)
    </script>
  </body>
</html>
