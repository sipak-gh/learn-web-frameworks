<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VanJS list with VanX</title>
    <script type="importmap">
      {
        "imports": {
          "vanjs-core": "../node_modules/vanjs-core/src/van.js",
          "vanjs-ext": "../node_modules/vanjs-ext/src/van-x.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import van from 'vanjs-core'
      import * as vanX from 'vanjs-ext'

      const { input, label, li, main, span, ul } = van.tags

      // Every field of every task becomes its own state.
      const tasks = vanX.reactive([
        { id: '1', title: 'Write the outline', done: true },
        { id: '2', title: 'Draft chapter 10', done: false },
        { id: '3', title: 'Run the tests', done: false },
      ])

      // Each <li> is built once; only the bindings that read task.done update.
      van.add(
        document.body,
        main(
          vanX.list(ul, tasks, ({ val: task }) =>
            li(
              { class: () => (task.done ? 'task done' : 'task') },
              label(
                input({
                  type: 'checkbox',
                  checked: () => task.done,
                  onchange: () => (task.done = !task.done),
                }),
                ' ',
                span(() => task.title),
              ),
            ),
          ),
        ),
      )
    </script>
  </body>
</html>
