<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mithril clock</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="node_modules/mithril/mithril.js"></script>
    <script>
      // Counts the seconds since the page loaded. Or should.
      function Clock() {
        let seconds = 0
        setInterval(() => {
          seconds += 1
        }, 1000)
        return {
          view: () => [
            m('p', `${seconds} seconds`),
            m('button', { type: 'button', onclick: () => {} }, 'Refresh'),
          ],
        }
      }

      m.mount(document.getElementById('app'), Clock)
    </script>
  </body>
</html>
